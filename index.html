<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JMessage</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='15%25' fill='%2334C759'/%3E%3Cpath d='M256 100c-102.5 0-185.6 70.3-185.6 157 0 49.3 26.6 93.3 68.6 123.1-6.1 23.3-22 62.4-22.7 64-.5 1.2-.1 2.6 1 3.4.5.3 1 .5 1.5.5.9 0 1.8-.4 2.4-1.1 1.1-1.3 43-51.5 61.1-68.8 23.2 10.3 49 16.3 73.7 16.3 102.5 0 185.6-70.3 185.6-157S358.5 100 256 100z' fill='white'/%3E%3C/svg%3E">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* ==========================================================================
           IOS JMESSAGE CSS RESET & VARIABLES
           ========================================================================== */
        :root {
            /* iOS Dark Mode Colors */
            --bg-base: #000000;
            --bg-elevated: #1c1c1e;
            --bg-elevated-hover: #2c2c2e;
            --bg-blur: rgba(28, 28, 30, 0.75);
            --bg-blur-light: rgba(44, 44, 46, 0.75);
            
            --tint-blue: #0a84ff;
            --tint-blue-active: #0060cb;
            --tint-green: #30d158;
            --tint-red: #ff453a;
            --tint-gray: #8e8e93;
            
            --text-primary: #ffffff;
            --text-secondary: #ebebf599; /* 60% opacity */
            --text-tertiary: #ebebf54d;  /* 30% opacity */
            --text-placeholder: #ebebf54d;
            
            --separator: #38383a;
            --separator-opaque: #38383a;
            
            --bubble-me: #0a84ff;
            --bubble-them: #26252a;
            --bubble-them-text: #ffffff;
            
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            --font-family-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            
            --easing: cubic-bezier(0.25, 1, 0.5, 1);
            --transition-fast: 0.15s var(--easing);
            --transition-med: 0.3s var(--easing);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background-color: #121212; /* Outer page background */
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, #2a2a35 0%, #121212 60%);
        }

        /* ==========================================================================
           DEVICE WRAPPER & RESPONSIVE LAYOUT
           ========================================================================== */
        .device-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .jmessage-app {
            background-color: var(--bg-base);
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            overflow: hidden;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 20px 40px rgba(0,0,0,0.5);
        }

        @media (min-width: 850px) {
            .jmessage-app {
                width: 1200px;
                height: 90vh;
                border-radius: 12px;
                max-height: 900px;
            }
        }

        /* ==========================================================================
           SIDEBAR (CONVERSATION LIST)
           ========================================================================== */
        .sidebar {
            width: 350px;
            height: 100%;
            background-color: var(--bg-base);
            border-right: 1px solid var(--separator);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 20;
            transition: transform 0.3s var(--easing);
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                width: 100%;
                transform: translateX(0);
            }
            .sidebar.hidden-mobile {
                transform: translateX(-100%);
            }
        }

        .sidebar-header {
            padding: 16px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-blur);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .sidebar-header h1 {
            font-family: var(--font-family-display);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .sidebar-actions {
            display: flex;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--tint-blue);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity var(--transition-fast);
        }
        .icon-btn:active {
            opacity: 0.5;
        }
        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .search-container {
            padding: 8px 16px 12px;
            background-color: var(--bg-base);
        }

        .search-bar {
            background-color: var(--bg-elevated);
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 6px 8px;
        }

        .search-bar svg {
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
            margin: 0 6px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            width: 100%;
            outline: none;
            font-family: var(--font-family);
        }
        .search-bar input::placeholder {
            color: var(--text-placeholder);
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .conversation-list::-webkit-scrollbar {
            display: none; /* Hide scrollbar for iOS feel */
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color var(--transition-fast);
            position: relative;
        }
        .chat-item:active {
            background-color: var(--bg-elevated);
        }
        .chat-item.active {
            background-color: var(--tint-blue);
        }
        .chat-item:not(:last-child)::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 76px; /* Align with text */
            right: 0;
            height: 1px;
            background-color: var(--separator);
        }
        .chat-item.active::after {
            display: none;
        }

        .avatar-lrg {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(180deg, #999, #666);
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .chat-item.active .avatar-lrg {
            border: 2px solid white;
        }

        .chat-preview {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .chat-preview-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2px;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item.active .chat-name {
            color: white;
        }

        .chat-time {
            font-size: 14px;
            color: var(--text-secondary);
            flex-shrink: 0;
            margin-left: 10px;
        }
        .chat-item.active .chat-time {
            color: rgba(255,255,255,0.8);
        }

        .chat-msg-preview {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }
        .chat-item.active .chat-msg-preview {
            color: rgba(255,255,255,0.8);
        }

        /* ==========================================================================
           MAIN CHAT VIEW
           ========================================================================== */
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
            position: relative;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .main-view {
                position: absolute;
                width: 100%;
                height: 100%;
                transform: translateX(100%);
                transition: transform 0.3s var(--easing);
            }
            .main-view.active-mobile {
                transform: translateX(0);
            }
        }

        /* --- Chat Header --- */
        .chat-header {
            height: 60px;
            background-color: var(--bg-blur);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--separator);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header-left {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .back-btn {
            display: none;
            align-items: center;
            color: var(--tint-blue);
            font-size: 17px;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
        }
        .back-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            margin-right: -4px;
        }

        @media (max-width: 768px) {
            .back-btn {
                display: flex;
            }
        }

        .header-center {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .header-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(180deg, #999, #666);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            margin-bottom: 2px;
        }

        .header-name-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .header-name-wrap svg {
            width: 8px;
            height: 8px;
            fill: var(--text-secondary);
        }

        .header-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
        }

        /* --- Chat History --- */
        .chat-history {
            flex: 1;
            padding: 80px 16px 20px; /* Top padding clears header */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .chat-history::-webkit-scrollbar {
            display: none;
        }

        .timestamp {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 24px 0 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .msg-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 2px; /* Tight gap between messages of same sender */
            width: 100%;
        }

        .msg-group.spacer {
            margin-bottom: 12px; /* Space between different senders */
        }

        .bubble-wrapper {
            display: flex;
            width: 100%;
            margin-bottom: 2px;
        }

        .bubble-wrapper.me {
            justify-content: flex-end;
        }

        .bubble-wrapper.them {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 8px 14px;
            font-size: 16px;
            line-height: 1.35;
            word-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
            z-index: 1;
        }

        /* EXACT IOS TAILS AND RADII */
        .me .bubble {
            background-color: var(--bubble-me);
            color: white;
            border-radius: 18px 18px 4px 18px;
        }
        
        /* If it's the top message in a group */
        .me .bubble.top {
            border-radius: 18px 18px 4px 18px;
        }
        /* Middle message */
        .me .bubble.middle {
            border-radius: 18px 4px 4px 18px;
        }
        /* Bottom message (has tail) */
        .me .bubble.bottom {
            border-radius: 18px 4px 18px 18px;
        }
        /* Single message (has tail) */
        .me .bubble.single {
            border-radius: 18px;
        }

        /* The Tail for 'me' */
        .me .bubble.bottom::before, .me .bubble.single::before {
            content: "";
            position: absolute;
            bottom: 0;
            right: -8px;
            height: 20px;
            width: 20px;
            background-color: var(--bubble-me);
            border-bottom-left-radius: 16px;
            z-index: -1;
        }
        .me .bubble.bottom::after, .me .bubble.single::after {
            content: "";
            position: absolute;
            bottom: 0;
            right: -10px;
            height: 20px;
            width: 20px;
            background-color: var(--bg-base); /* match background to cut out shape */
            border-bottom-left-radius: 10px;
            z-index: -1;
        }

        .them .bubble {
            background-color: var(--bubble-them);
            color: var(--bubble-them-text);
            border-radius: 18px 18px 18px 4px;
        }

        .them .bubble.top {
            border-radius: 18px 18px 18px 4px;
        }
        .them .bubble.middle {
            border-radius: 4px 18px 18px 4px;
        }
        .them .bubble.bottom {
            border-radius: 4px 18px 18px 18px;
        }
        .them .bubble.single {
            border-radius: 18px;
        }

        /* The Tail for 'them' */
        .them .bubble.bottom::before, .them .bubble.single::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: -8px;
            height: 20px;
            width: 20px;
            background-color: var(--bubble-them);
            border-bottom-right-radius: 16px;
            z-index: -1;
        }
        .them .bubble.bottom::after, .them .bubble.single::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: -10px;
            height: 20px;
            width: 20px;
            background-color: var(--bg-base);
            border-bottom-right-radius: 10px;
            z-index: -1;
        }

        .status-text {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 2px;
            margin-right: 8px;
            opacity: 0;
            transition: opacity 0.3s;
            height: 0;
            overflow: hidden;
        }
        .status-text.show {
            opacity: 1;
            height: auto;
            margin-bottom: 8px;
        }

        /* --- Media Attachments within Bubbles --- */
        .media-preview {
            max-width: 250px;
            border-radius: 14px;
            overflow: hidden;
            margin: 2px;
        }
        .media-preview img, .media-preview video {
            width: 100%;
            display: block;
            object-fit: cover;
        }
        /* Remove padding for media bubbles */
        .bubble.media-bubble {
            padding: 0;
            background: transparent !important;
        }
        .bubble.media-bubble::before, .bubble.media-bubble::after {
            display: none;
        }

        /* ==========================================================================
           INPUT AREA (IOS STYLE)
           ========================================================================== */
        .input-area-container {
            padding: 8px 16px 24px;
            background-color: var(--bg-blur);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid var(--separator);
            position: relative;
            z-index: 100;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .btn-plus {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: none;
            cursor: pointer;
            margin-bottom: 2px;
        }
        .btn-plus svg {
            width: 16px;
            height: 16px;
            fill: var(--tint-gray);
        }

        .input-field-wrapper {
            flex: 1;
            background-color: var(--bg-base);
            border: 1px solid var(--separator);
            border-radius: 20px;
            display: flex;
            align-items: flex-end;
            min-height: 36px;
            position: relative;
            padding-right: 36px; /* space for absolute button */
        }

        #messageInput {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            line-height: 1.3;
            padding: 8px 12px;
            max-height: 120px;
            resize: none;
            outline: none;
            font-family: var(--font-family);
        }
        #messageInput::placeholder {
            color: var(--text-placeholder);
        }

        .btn-action-right {
            position: absolute;
            right: 4px;
            bottom: 4px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        /* Mic state */
        .btn-action-right.state-mic {
            background-color: transparent;
        }
        .btn-action-right.state-mic svg {
            width: 16px;
            height: 16px;
            fill: var(--tint-gray);
        }

        /* Send state */
        .btn-action-right.state-send {
            background-color: var(--tint-blue);
        }
        .btn-action-right.state-send:active {
            background-color: var(--tint-blue-active);
        }
        .btn-action-right.state-send svg {
            width: 14px;
            height: 14px;
            fill: white;
            margin-top: -1px; /* Optical adjustment */
        }

        /* App Drawer (Bar above keyboard) */
        .app-drawer {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            padding: 0 4px;
            overflow-x: auto;
        }
        .app-drawer::-webkit-scrollbar { display: none; }
        
        .app-icon {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
        }
        .app-icon svg { width: 18px; height: 18px; fill: white; }
        
        .app-photos { background: linear-gradient(135deg, #FF2D55, #FF375F); }
        .app-store { background: linear-gradient(135deg, #0A84FF, #007AFF); }
        .app-camera { background: linear-gradient(135deg, #8E8E93, #C7C7CC); }
        .app-music { background: linear-gradient(135deg, #FF2D55, #FF375F); }
        .app-digital { background: black; border: 1px solid #333; }
        .app-digital svg { fill: #00FF00; }

        /* ==========================================================================
           MODALS & OVERLAYS (CONNECTION / NEW MESSAGE)
           ========================================================================== */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-base);
            z-index: 500;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.4s var(--easing);
        }
        .modal-overlay.active {
            transform: translateY(0);
        }

        .modal-header {
            height: 60px;
            background-color: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--separator);
        }
        .modal-header button {
            background: none; border: none; font-size: 17px; color: var(--tint-blue); cursor: pointer;
        }
        .modal-header h2 {
            font-size: 17px; font-weight: 600;
        }

        .modal-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .form-group {
            background-color: var(--bg-elevated);
            border-radius: 10px;
            padding: 0 16px;
            margin-bottom: 20px;
        }
        .form-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--separator);
        }
        .form-row:last-child { border-bottom: none; }
        .form-label {
            color: var(--text-secondary);
            width: 80px;
            font-size: 16px;
        }
        .form-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }
        .form-text-large {
            font-family: monospace;
            font-size: 18px;
            color: var(--tint-blue);
            letter-spacing: 2px;
        }

        .blocker-overlay {
            position: absolute;
            top: 60px; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-base);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .blocker-overlay p {
            color: var(--text-secondary);
            font-size: 16px;
            margin-top: 10px;
        }

        /* File Input Hidden */
        input[type="file"] { display: none; }
        
        .hidden { display: none !important; }

        /* Animation for typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background-color: var(--bubble-them);
            border-radius: 18px;
            width: fit-content;
            margin-bottom: 12px;
        }
        .typing-dot {
            width: 6px; height: 6px; border-radius: 50%; background-color: var(--text-secondary);
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

    </style>
</head>
<body>

    <div class="device-wrapper">
        <div class="jmessage-app">
            
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <button class="icon-btn" style="visibility: hidden;"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/></svg></button>
                    <h1>JMessages</h1>
                    <div class="sidebar-actions">
                        <button class="icon-btn" id="btnMyProfile" title="My ID">

                    <div class="header-right">
                        <button class="icon-btn"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
                        <button class="icon-btn" style="margin-right:-8px;"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>

                        <div class="input-field-wrapper">

                            <button class="btn-action-right state-mic" id="btnInputRight">

                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>

    <div class="modal-overlay" id="modalNewMessage">
        <div class="modal-header">
            <button onclick="closeModal('modalNewMessage')">Cancel</button>
            <h2>New JMessage</h2>
            <button style="opacity:0.5; pointer-events:none;">Add</button>
        </div>
        <div class="modal-content">
            <div class="form-group">
                <div class="form-row">
                    <div class="form-label">To:</div>
                    <input type="text" class="form-input" id="inputTargetID" placeholder="Enter Peer ID..." autocomplete="off" autocorrect="off" autocapitalize="off">
                </div>
            </div>
            <button class="icon-btn" id="btnConnectExecute" style="width:100%; background:var(--tint-blue); color:white; border-radius:10px; padding:12px; font-size:16px; font-weight:600;">Start Chat</button>
            <p id="connectStatus" style="text-align:center; margin-top:16px; color:var(--text-secondary);"></p>
        </div>
    </div>

    <div class="modal-overlay" id="modalProfile">
        <div class="modal-header">
            <button onclick="closeModal('modalProfile')">Done</button>
            <h2>My Details</h2>
            <button style="opacity:0;">.</button>
        </div>
        <div class="modal-content" style="display:flex; flex-direction:column; align-items:center;">
            <div class="avatar-lrg" style="width:80px; height:80px; font-size:32px; margin-top:20px; margin-bottom:20px;">Me</div>
            <div class="form-group" style="width:100%;">
                <div class="form-row" style="flex-direction:column; align-items:flex-start;">
                    <div class="form-label" style="width:100%; margin-bottom:8px; font-size:14px;">Your Peer ID</div>
                    <div class="form-text-large" id="displayMyID">GENERATING...</div>
                </div>
            </div>
            <p style="color:var(--text-secondary); font-size:14px; text-align:center;">Share this ID with friends so they can start a JMessage with you.</p>
        </div>
    </div>


    <script>
        // --- Core Application State ---
        const AppState = {
            peer: null,
            myId: null,
            connections: {}, // Store active connections by Peer ID
            activeChatId: null,
            lastMessageTime: 0, // for timestamps
            lastSender: null,   // for grouping bubbles
            isMobile: window.innerWidth <= 768
        };

        const SVGS = {
            mic: '<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>',
            send: '<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>'
        };

        // --- DOM Elements ---
        const DOM = {
            sidebar: document.getElementById('sidebar'),
            mainView: document.getElementById('mainView'),
            convList: document.getElementById('conversationList'),
            chatHistory: document.getElementById('chatHistory'),
            chatBlocker: document.getElementById('chatBlocker'),
            
            // Header
            activeAvatar: document.getElementById('activeAvatar'),
            activeName: document.getElementById('activeName'),
            
            // Input
            messageInput: document.getElementById('messageInput'),
            btnInputRight: document.getElementById('btnInputRight'),
            fileInput: document.getElementById('fileInput'),
            
            // Modals
            modalNewMsg: document.getElementById('modalNewMessage'),
            modalProfile: document.getElementById('modalProfile'),
            displayMyID: document.getElementById('displayMyID'),
            inputTargetID: document.getElementById('inputTargetID'),
            btnConnectExe: document.getElementById('btnConnectExecute'),
            connectStatus: document.getElementById('connectStatus')
        };

        // --- Initialization ---
        function initApp() {
            // Generate nice 6 char ID
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let id = '';
            for(let i=0; i<6; i++) id += chars.charAt(Math.floor(Math.random() * chars.length));
            
            AppState.peer = new Peer(id, {
                debug: 1,
                config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]}
            });

            AppState.peer.on('open', (assignedId) => {
                AppState.myId = assignedId;
                DOM.displayMyID.textContent = assignedId;
            });

            AppState.peer.on('connection', (conn) => {
                setupConnection(conn, false);
            });

            // Window resize handler for mobile/desktop layout
            window.addEventListener('resize', () => {
                AppState.isMobile = window.innerWidth <= 768;
                if(!AppState.isMobile) {
                    DOM.sidebar.classList.remove('hidden-mobile');
                    DOM.mainView.classList.remove('active-mobile');
                }
            });
        }

        // --- Peer Connection Logic ---
        function initiateConnection() {
            const target = DOM.inputTargetID.value.trim().toUpperCase();
            if(!target || target === AppState.myId) return;
            
            DOM.connectStatus.textContent = "Connecting...";
            const conn = AppState.peer.connect(target, {reliable: true});
            setupConnection(conn, true);
        }

        function setupConnection(conn, isInitiator) {
            conn.on('open', () => {
                if(isInitiator) {
                    closeModal('modalNewMessage');
                    DOM.inputTargetID.value = '';
                    DOM.connectStatus.textContent = '';
                }
                
                // Add to state
                if(!AppState.connections[conn.peer]) {
                    AppState.connections[conn.peer] = {
                        conn: conn,
                        history: [], // store msg objects {sender, text, time}
                        unread: 0
                    };
                    renderSidebarItem(conn.peer);
                }
                
                // Automatically open chat if initiator
                if(isInitiator) {
                    openChat(conn.peer);
                } else if (AppState.activeChatId !== conn.peer) {
                    // Increment unread if background
                    AppState.connections[conn.peer].unread++;
                    updateSidebarItem(conn.peer);
                }
            });

            conn.on('data', (data) => {
                handleIncomingData(conn.peer, data);
            });

            conn.on('close', () => {
                handleDisconnect(conn.peer);
            });
            conn.on('error', () => {
                handleDisconnect(conn.peer);
            });
        }

        function handleDisconnect(peerId) {
            if(AppState.connections[peerId]) {
                appendSystemMessage(peerId, "Connection ended.");
                delete AppState.connections[peerId];
                
                // Update UI if looking at it
                if(AppState.activeChatId === peerId) {
                    DOM.activeName.textContent = peerId + " (Offline)";
                    DOM.activeName.style.color = "var(--tint-red)";
                }
            }
        }

        // --- UI Navigation ---
        function openChat(peerId) {
            const contactName = prompt("Enter contact name for " + peerId) || peerId; // <--- ADD THIS LINE
            AppState.activeChatId = peerId;
            AppState.connections[peerId].unread = 0;
            
            // UI Updates
            DOM.chatBlocker.classList.add('hidden');
            DOM.activeName.textContent = contactName;
            DOM.activeName.style.color = "var(--text-primary)";
            DOM.activeAvatar.textContent = contactName.substring(0,2).toUpperCase();
            
            // Clear history and re-render
            DOM.chatHistory.innerHTML = '';
            AppState.lastSender = null;
            AppState.lastMessageTime = 0;
            
            AppState.connections[peerId].history.forEach(msg => {
                renderMessageBubble(msg.sender, msg.type, msg.payload, msg.timestamp, false);
            });
            scrollToBottom();

            // Mobile slide
            if(AppState.isMobile) {
                DOM.sidebar.classList.add('hidden-mobile');
                DOM.mainView.classList.add('active-mobile');
            }

            // Update Sidebar visually
            updateSidebarItem(peerId);
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`sidebar-item-${peerId}`);
            if(activeEl) activeEl.classList.add('active');
            
            DOM.messageInput.focus();
        }

        DOM.btnBackToSidebar = document.getElementById('btnBackToSidebar');
        DOM.btnBackToSidebar.addEventListener('click', () => {
            if(AppState.isMobile) {
                DOM.sidebar.classList.remove('hidden-mobile');
                DOM.mainView.classList.remove('active-mobile');
            }
        });

        // --- Sidebar Rendering ---
        function renderSidebarItem(peerId) {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.id = `sidebar-item-${peerId}`;
            div.onclick = () => openChat(peerId);
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar-lrg';
            avatar.textContent = peerId.substring(0,2);
            
            const preview = document.createElement('div');
            preview.className = 'chat-preview';
            
            const header = document.createElement('div');
            header.className = 'chat-preview-header';
            header.innerHTML = `<div class="chat-name">${peerId}</div><div class="chat-time" id="time-${peerId}">Just now</div>`;
            
            const msgPrev = document.createElement('div');
            msgPrev.className = 'chat-msg-preview';
            msgPrev.id = `prev-${peerId}`;
            msgPrev.textContent = "New connection established";
            
            preview.appendChild(header);
            preview.appendChild(msgPrev);
            div.appendChild(avatar);
            div.appendChild(preview);
            
            DOM.convList.prepend(div);
        }

        function updateSidebarItem(peerId) {
            const item = document.getElementById(`sidebar-item-${peerId}`);
            if(!item) return;
            
            const connData = AppState.connections[peerId];
            if(!connData) return;
            
            const lastMsg = connData.history[connData.history.length - 1];
            if(lastMsg) {
                const prev = document.getElementById(`prev-${peerId}`);
                if(lastMsg.type === 'text') {
                    prev.textContent = lastMsg.payload;
                } else if (lastMsg.type === 'image') {
                    prev.textContent = "📷 Image";
                } else {
                    prev.textContent = "📁 Attachment";
                }
                
                // Bold if unread
                if(connData.unread > 0 && AppState.activeChatId !== peerId) {
                    prev.style.fontWeight = '600';
                    prev.style.color = 'var(--text-primary)';
                } else {
                    prev.style.fontWeight = 'normal';
                    prev.style.color = '';
                }
            }
            
            // Move to top
            DOM.convList.prepend(item);
        }

        // --- Message Rendering & Grouping Logic ---
        function formatTime(date) {
            return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        function getFormattedDayTime(date) {
            const today = new Date();
            const isToday = date.getDate() === today.getDate() && date.getMonth() === today.getMonth();
            const timeStr = formatTime(date);
            
            if (isToday) return `Today ${timeStr}`;
            
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            return `${days[date.getDay()]} ${timeStr}`;
        }

        function appendSystemMessage(peerId, text) {
            const msgObj = { sender: 'system', type: 'text', payload: text, timestamp: new Date() };
            if(AppState.connections[peerId]) {
                AppState.connections[peerId].history.push(msgObj);
            }
            if(AppState.activeChatId === peerId) {
                const div = document.createElement('div');
                div.className = 'timestamp';
                div.textContent = text;
                DOM.chatHistory.appendChild(div);
                scrollToBottom();
            }
        }

        function renderMessageBubble(sender, type, payload, timestamp, animate) {
            // Timestamp Logic (if gap > 1 hour, or first msg)
            if (timestamp.getTime() - AppState.lastMessageTime > 3600000) {
                const timeDiv = document.createElement('div');
                timeDiv.className = 'timestamp';
                timeDiv.textContent = getFormattedDayTime(timestamp);
                DOM.chatHistory.appendChild(timeDiv);
                AppState.lastSender = null; // force new group
            }
            AppState.lastMessageTime = timestamp.getTime();

            // Grouping Logic to assign exact iOS bubble shapes
            let currentGroup;
            
            if (AppState.lastSender === sender) {
                // Find the last group
                currentGroup = DOM.chatHistory.lastElementChild;
                if(currentGroup && currentGroup.classList.contains('msg-group')) {
                    // Update classes of previous bubbles in this group
                    const bubbles = currentGroup.querySelectorAll('.bubble');
                    if(bubbles.length > 0) {
                        const lastBubble = bubbles[bubbles.length - 1];
                        lastBubble.classList.remove('bottom', 'single');
                        if (bubbles.length === 1) {
                            lastBubble.classList.add('top');
                        } else {
                            lastBubble.classList.add('middle');
                        }
                    }
                } else {
                    currentGroup = createNewGroup(sender);
                }
            } else {
                // Add spacer to previous group if exists
                if(DOM.chatHistory.lastElementChild && DOM.chatHistory.lastElementChild.classList.contains('msg-group')) {
                    DOM.chatHistory.lastElementChild.classList.add('spacer');
                }
                currentGroup = createNewGroup(sender);
            }
            
            AppState.lastSender = sender;

            // Create Bubble
            const wrap = document.createElement('div');
            wrap.className = `bubble-wrapper ${sender}`;
            
            const bubble = document.createElement('div');
            // By default, a new bubble added to the bottom is the 'bottom' one, unless it's the only one, then it's 'single'.
            const countInGroup = currentGroup.querySelectorAll('.bubble').length;
            bubble.className = `bubble ${countInGroup === 0 ? 'single' : 'bottom'}`;

            if (type === 'text') {
                bubble.textContent = payload;
            } else if (type === 'image') {
                bubble.classList.add('media-bubble');
                const prev = document.createElement('div');
                prev.className = 'media-preview';
                const img = document.createElement('img');
                img.src = payload;
                img.onload = scrollToBottom;
                prev.appendChild(img);
                bubble.appendChild(prev);
            }

            wrap.appendChild(bubble);
            currentGroup.appendChild(wrap);

            // Add "Delivered" text if it's 'me' and last message
            if (sender === 'me') {
                // Remove delivered from all previous
                document.querySelectorAll('.status-text').forEach(el => el.remove());
                const status = document.createElement('div');
                status.className = 'status-text show';
                status.textContent = 'Delivered';
                currentGroup.appendChild(status);
            }

            if (animate) scrollToBottom();
        }

        function createNewGroup(sender) {
            const group = document.createElement('div');
            group.className = `msg-group ${sender}`;
            DOM.chatHistory.appendChild(group);
            return group;
        }

        function scrollToBottom() {
            setTimeout(() => {
                DOM.chatHistory.scrollTop = DOM.chatHistory.scrollHeight;
            }, 50);
        }

        // --- Data Handling ---
        function handleIncomingData(peerId, data) {
            const connData = AppState.connections[peerId];
            if(!connData) return;

            const msgObj = {
                sender: 'them',
                type: data.type,
                payload: data.payload,
                timestamp: new Date()
            };

            connData.history.push(msgObj);

            if (AppState.activeChatId === peerId) {
                renderMessageBubble('them', data.type, data.payload, msgObj.timestamp, true);
            } else {
                connData.unread++;
            }
            updateSidebarItem(peerId);
        }

        function sendMessage() {
            const text = DOM.messageInput.value.trim();
            if(!text || !AppState.activeChatId) return;
            
            const connData = AppState.connections[AppState.activeChatId];
            if(!connData || !connData.conn.open) return;

            // Send
            connData.conn.send({ type: 'text', payload: text });

            // Render Local
            const msgObj = { sender: 'me', type: 'text', payload: text, timestamp: new Date() };
            connData.history.push(msgObj);
            renderMessageBubble('me', 'text', text, msgObj.timestamp, true);
            
            updateSidebarItem(AppState.activeChatId);

            // Reset Input
            DOM.messageInput.value = '';
            DOM.messageInput.style.height = 'auto'; // reset height
            toggleInputRightAction(false);
            DOM.messageInput.focus();
        }

        // Send Image handling (simplified base64 for demo)
        DOM.fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file || !AppState.activeChatId) return;
            
            const reader = new FileReader();
            reader.onload = (ev) => {
                const base64 = ev.target.result;
                const connData = AppState.connections[AppState.activeChatId];
                if(connData && connData.conn.open) {
                    connData.conn.send({ type: 'image', payload: base64 });
                    const msgObj = { sender: 'me', type: 'image', payload: base64, timestamp: new Date() };
                    connData.history.push(msgObj);
                    renderMessageBubble('me', 'image', base64, msgObj.timestamp, true);
                    updateSidebarItem(AppState.activeChatId);
                }
            };
            reader.readAsDataURL(file);
        });


        // --- Input UI Interactions ---
        
        function toggleInputRightAction(hasText) {
            if(hasText) {
                DOM.btnInputRight.classList.remove('state-mic');
                DOM.btnInputRight.classList.add('state-send');
                DOM.btnInputRight.innerHTML = SVGS.send;
            } else {
                DOM.btnInputRight.classList.remove('state-send');
                DOM.btnInputRight.classList.add('state-mic');
                DOM.btnInputRight.innerHTML = SVGS.mic;
            }
        }

        DOM.messageInput.addEventListener('input', function() {
            // Auto resize
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px';
            
            // Toggle icon
            toggleInputRightAction(this.value.trim().length > 0);
        });

        DOM.messageInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        DOM.btnInputRight.addEventListener('click', () => {
            if(DOM.btnInputRight.classList.contains('state-send')) {
                sendMessage();
            }
        });

        // --- Modals ---
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        document.getElementById('btnNewMessage').addEventListener('click', () => openModal('modalNewMessage'));
        document.getElementById('btnMyProfile').addEventListener('click', () => openModal('modalProfile'));
        DOM.btnConnectExe.addEventListener('click', initiateConnection);

        // Boot
        initApp();
